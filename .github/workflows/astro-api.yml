name: astro-api

on:
  push:
    paths: ["astro-api/**"]
  pull_request:
    paths: ["astro-api/**"]

defaults:
  run:
    working-directory: astro-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://astro_app:app-ci@localhost:5432/astro
      AUTH_DATABASE_URL: postgresql+asyncpg://astro_auth:auth-ci@localhost:5432/astro
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://astro_owner:owner-ci@localhost:5432/astro
      TEST_DATABASE_NAME: astro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app scripts tests
      - name: Create roles and databases
        env:
          PGPASSWORD: postgres
        run: |
          for db in astro astro_test; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -v owner_pw=owner-ci -v app_pw=app-ci -v auth_pw=auth-ci -v db=$db -f scripts/db_roles.sql
          done
      - name: Tests (cross-tenant, RLS, auth, voice, security)
        run: pytest -q

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: astro-api
          push: true
          tags: ghcr.io/${{ github.repository }}/astro-api:${{ github.sha }}
