[project]
name = "astro-api"
version = "0.1.0"
description = "Backend for Astro, the company superagent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "redis>=5.0,<7",
    "arq>=0.26,<1",
    "aiosmtplib>=3.0,<5",
    "structlog>=24.1,<26",
    "prometheus-client>=0.20,<1",
    "uuid-utils>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "mypy>=1.11",
]
load = ["locust>=2.29"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "B008"]  # asserts in tests; FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"scripts/*" = ["S603", "S607", "S310"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
